      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F9FBFA"/>
      <stop offset="100%" stop-color="#EEF4F2"/>
    </radialGradient>
    <radialGradient id="khatta-shadow" cx="50%" cy="50%" r="50%">

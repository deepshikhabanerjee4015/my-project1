    <text x="400" y="167" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="0.5">HALDIRAM'S</text>
    <!-- Product title -->
    <text x="400" y="218" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="26" fill="#FFFFFF">Khatta Meetha</text>
    <text x="400" y="244" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" fill-opacity="0.9">Sweet & Tangy Namkeen Mix</text>
    <!-- Visual Window / Illustration -->
    <rect x="278" y="264" width="244" height="155" rx="22" fill="#FFFDE7" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>
    
      <ellipse cx="400" cy="368" rx="90" ry="26" fill="#00695C"/>
      <circle cx="365" cy="330" r="10" fill="#FBC02D"/><circle cx="395" cy="318" r="9" fill="#43A047"/><circle cx="425" cy="326" r="10" fill="#FB8C00"/>
      <circle cx="380" cy="342" r="8" fill="#E53935"/><circle cx="412" cy="340" r="9" fill="#FDD835"/><circle cx="440" cy="344" r="8" fill="#8D6E63"/>
    

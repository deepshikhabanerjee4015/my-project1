      </linearGradient>
    </defs>
    <!-- Pouch Body -->
    <path d="M248 92 L552 92 L566 126 L562 478 Q562 496 544 498 L256 498 Q238 496 238 478 L234 126 Z" fill="url(#khatta-pouch)" stroke="#1B2A2D" stroke-opacity="0.15" stroke-width="2"/>

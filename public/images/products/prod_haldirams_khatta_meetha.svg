      <stop offset="68%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#khatta-bg)"/>
  <ellipse cx="400" cy="512" rx="185" ry="26" fill="url(#khatta-shadow)"/>
  
    <defs>
      <linearGradient id="khatta-pouch" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#00838F"/>

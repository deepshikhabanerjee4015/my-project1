<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <defs>
    <radialGradient id="ariel-bg" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F9FBFA"/>
      <stop offset="100%" stop-color="#EEF4F2"/>
    </radialGradient>
    <radialGradient id="ariel-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3236" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#1E3236" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1E3236" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ariel-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="22%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="78%" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="ariel-foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="68%" stop-color="#000000" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ariel-bg)"/>
  <ellipse cx="400" cy="512" rx="185" ry="26" fill="url(#ariel-shadow)"/>
  
    <defs>
      <linearGradient id="ariel-pouch" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#00796B"/>
        <stop offset="100%" stop-color="#004D40"/>
      </linearGradient>
    </defs>
    <!-- Pouch Body -->
    <path d="M248 92 L552 92 L566 126 L562 478 Q562 496 544 498 L256 498 Q238 496 238 478 L234 126 Z" fill="url(#ariel-pouch)" stroke="#1B2A2D" stroke-opacity="0.15" stroke-width="2"/>
    <!-- Top & bottom crimp seals -->
    <rect x="246" y="88" width="308" height="20" rx="4" fill="#00796B" stroke="#000" stroke-opacity="0.12"/>
    <path d="M254 98 H546" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="242" y="482" width="316" height="16" rx="4" fill="#004D40" stroke="#000" stroke-opacity="0.12"/>
    <!-- Foil sheen -->
    <path d="M248 92 L552 92 L566 126 L562 478 Q562 496 544 498 L256 498 Q238 496 238 478 L234 126 Z" fill="url(#ariel-foil)"/>
    <!-- Brand banner -->
    <rect x="285" y="132" width="230" height="54" rx="12" fill="#FFFFFF"/>
    <text x="400" y="167" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="0.5">ARIEL</text>
    <!-- Product title -->
    <text x="400" y="218" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="800" font-size="26" fill="#FFFFFF">MATIC</text>
    <text x="400" y="244" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" fill-opacity="0.9">Top/Front Load Detergent</text>
    <!-- Visual Window / Illustration -->
    <rect x="278" y="264" width="244" height="155" rx="22" fill="#E0F2F1" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>
    
      <circle cx="400" cy="340" r="46" fill="none" stroke="#00897B" stroke-width="6"/>
      <ellipse cx="400" cy="340" rx="58" ry="22" transform="rotate(30 400 340)" fill="none" stroke="#1E88E5" stroke-width="4"/>
      <ellipse cx="400" cy="340" rx="58" ry="22" transform="rotate(-30 400 340)" fill="none" stroke="#43A047" stroke-width="4"/>
      <text x="400" y="167" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="26" fill="#00695C">ARIEL</text>
    
    <!-- Weight Pill -->
    <rect x="348" y="434" width="104" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="400" y="454" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="700" font-size="14" fill="#1F2F33">1 kg</text>
  
</svg>